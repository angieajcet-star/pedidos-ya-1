<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PedidosYa - Login Mockup</title>
  <!-- Fuente Roboto desde Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Enlace a tu archivo CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Marco del teléfono móvil -->
  <div class="phone-mockup">
    
    <!-- Barra superior de estado (Status bar) -->
    <div class="status-bar">
      <span class="time">09:52 AM</span>
      <div class="status-icons">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.35a.75.75 0 001.06 1.06l1.74-1.74C8.68 19.5 10.28 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"/></svg>
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17 4h-3V2h-4v2H7c-.55 0-1 .45-1 1v16c0 .55.45 1 1 1h10c.55 0 1-.45 1-1V5c0-.55-.45-1-1-1z"/></svg>
      </div>
    </div>

    <!-- Módulo Header Rojo -->
    <header class="header">
      <!-- Logo de PedidosYa -->
      <div class="brand-logo">
        <span class="p-icon">P</span>
        <span class="brand-name">PedidosYa</span>
      </div>

      <!-- Imagen promocional de la comida -->
      <div class="food-banner">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=600&auto=format&fit=crop" alt="Pizza y comida PedidosYa">
      </div>
    </header>

    <!-- Sección del formulario de Login -->
    <main class="content">
      
      <!-- Botón Google -->
      <button class="btn btn-google">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continuar con Google</span>
      </button>

      <!-- Botón Facebook -->
      <button class="btn btn-facebook">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
        <span>Continuar con Facebook</span>
      </button>

      <!-- Enlace Otro Método -->
      <a href="#" class="other-method">Otro método</a>

    </main>

    <!-- Pie de página / Términos -->
    <footer class="footer">
      <p>Al continuar, aceptas nuestros <a href="#">Términos y Condiciones</a> y la <a href="#">Política de Privacidad</a>.</p>
    </footer>

  </div>

</body>
</html>
